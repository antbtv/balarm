# Лимиты памяти: ноутбук 15 ГБ, рядом работают IDE и другие сервисы.
# Kotlin компилируется внутри Gradle-демона (без отдельного Kotlin-демона),
# демон сам завершается после 10 минут простоя.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon.idletimeout=600000
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

