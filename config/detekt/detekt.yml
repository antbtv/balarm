# Поверх дефолтной конфигурации detekt (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    # @Composable-функции называются с заглавной буквы
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][A-Za-z0-9_]*"

style:
  ReturnCount:
    # Ранние `?: return` / `if (...) return` в начале функции — идиоматичные guard clause.
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated:
      - Preview
    excludes:
      - "**/test/**"
      - "**/androidTest/**"
      - "**/designsystem/**"
  UnusedPrivateFunction:
    ignoreAnnotated:
      - Preview

complexity:
  TooManyFunctions:
    # Считаем только публичный API: мелкие приватные помощники делают код читаемее.
    ignorePrivate: true
  LongParameterList:
    allowedFunctionParameters: 8
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - Composable
